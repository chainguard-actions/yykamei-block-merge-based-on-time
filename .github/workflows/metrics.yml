name: GitHub Workflows Metrics
on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"
permissions:
  actions: read
  issues: write
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: yykamei/github-workflows-metrics@6d666ef8bb2dc18c5efce53f387faee1bfc81a47 # main
        with:
          status: "success"
          aggregate: average
