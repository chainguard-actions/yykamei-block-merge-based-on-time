name: Block Merge Based on Time
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

jobs:
  block:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: yykamei/block-merge-based-on-time@ae7f50a8f8b0b2b88d2361794a696430d936a2db # main
        id: block
        with:
          timezone: Asia/Tokyo
          after: 03:00
          before: 04:00
      - run: echo "pr-blocked=$PR_BLOCKED"
        if: github.event_name == 'pull_request'
        env:
          PR_BLOCKED: ${{ steps.block.outputs.pr-blocked }}
