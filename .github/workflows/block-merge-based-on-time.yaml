name: Block Merge Based on Time
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

jobs:
  block:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: yykamei/block-merge-based-on-time@e3dead35a6e0a34de89c4a7db88eea941346b7a3 # main
        id: block
        with:
          timezone: Asia/Tokyo
          after: 03:00
          before: 04:00
      - env:
          PR_BLOCKED: ${{ steps.block.outputs.pr-blocked }}
        run: printf 'pr-blocked=%s\n' "${PR_BLOCKED}"
        if: github.event_name == 'pull_request'
