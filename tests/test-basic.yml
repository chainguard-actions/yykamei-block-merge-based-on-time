name: Test basic usage - no blocking
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          timezone: UTC
          after: "00:00"
          before: "00:00"
        continue-on-error: true
      - name: Assert action ran (not cancelled or skipped)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action makes real GitHub API calls and may fail if there are open PRs
          # with old commits. We accept both success and failure, just not skipped/cancelled.
          if [ "$OUTCOME" = "cancelled" ] || [ -z "$OUTCOME" ]; then
            echo "FAIL: action was cancelled or did not run"
            exit 1
          fi
          echo "PASS: action ran with outcome '$OUTCOME' (success or failure both acceptable)"
      - name: Assert pr-blocked output is not 'true' (workflow_dispatch has no PR context)
        env:
          PR_BLOCKED: ${{ steps.action.outputs.pr-blocked }}
        run: |
          echo "pr-blocked: $PR_BLOCKED"
          if [ "$PR_BLOCKED" = "true" ]; then
            echo "FAIL: pr-blocked should not be true under workflow_dispatch"
            exit 1
          fi
          echo "PASS: pr-blocked is not true (value: '$PR_BLOCKED')"
