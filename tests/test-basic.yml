name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          after: "17:30"
          before: "09:00"
          timezone: Asia/Tokyo
      - name: Assert action ran (or failed gracefully on the sentinel repo)
        env:
          RESULT: ${{ steps.action.outputs.pr-blocked }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "pr-blocked: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            # workflow_dispatch handles all pulls and does not set pr-blocked
            if [ -n "$RESULT" ]; then
              echo "FAIL: pr-blocked should not be set for workflow_dispatch, got '$RESULT'"
              exit 1
            fi
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
