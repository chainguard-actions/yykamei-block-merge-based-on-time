name: Test basic usage (no blocking)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          timezone: UTC
          after: "00:00"
          before: "00:00"
        continue-on-error: true
      - name: Assert action ran without unexpected failure
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may fail with a non-PR event context (no PR number),
          # but it should not crash with an unhandled exception.
          # Accept both success and failure (API call may fail without a real PR).
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
