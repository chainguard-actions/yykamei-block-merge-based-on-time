name: Test basic usage (workflow_dispatch, no blocking)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with default time window (no blocking expected)
        id: action
        uses: .
        continue-on-error: true
        with:
          after: "00:00"
          before: "00:00"
          timezone: "UTC"

      - name: Assert action ran (success or graceful failure on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PR_BLOCKED: ${{ steps.action.outputs.pr-blocked }}
        run: |
          echo "outcome: $OUTCOME"
          echo "pr-blocked: $PR_BLOCKED"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo not resolvable or non-PR event)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
