name: Test basic usage (workflow_dispatch, no blocking)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with minimal required inputs (no time-based blocking)
        id: action
        uses: .
        with:
          timezone: UTC
          after: "00:00"
          before: "00:00"
        continue-on-error: true
      - name: Assert action ran with valid inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may fail if the repo has open PRs with old commits (GitHub API limitation).
          # We only fail the test if the action was cancelled (unexpected state).
          if [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was cancelled unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with valid inputs (outcome=$OUTCOME)"
