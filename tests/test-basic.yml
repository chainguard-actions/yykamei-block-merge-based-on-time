name: Test basic usage (non-PR event)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          timezone: UTC
          after: "00:00"
          before: "00:00"

      - name: Assert action ran (non-PR event skips or fails gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PR_BLOCKED: ${{ steps.action.outputs.pr-blocked }}
        run: |
          echo "outcome: $OUTCOME"
          echo "pr-blocked: $PR_BLOCKED"
          # Under workflow_dispatch, the action may skip PR logic (success with no output)
          # or fail gracefully because there is no PR context.
          # Either outcome is acceptable — what is NOT acceptable is an unexpected outcome.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully on non-PR event"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no PR context under workflow_dispatch)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
