name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Under workflow_dispatch the action lists all PRs of GITHUB_REPOSITORY, which is a
      # sentinel repo under the harness, so the API call may 404.
      - id: action
        uses: .
        continue-on-error: true
        with:
          timezone: Asia/Tokyo
          after: "17:30, 16:30 on Monday"
          before: "09:00, 08:00 on Monday"
          prohibited-days-dates: "Sunday, Saturday, 2030-08-01, 2030-08-06/2030-08-10"
      - name: Assert action ran (succeeded, or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULT: ${{ steps.action.outputs.pr-blocked }}
        run: |
          echo "outcome: $OUTCOME"
          echo "pr-blocked: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            # pr-blocked is only set for pull_request events
            if [ -n "$RESULT" ]; then
              echo "FAIL: pr-blocked should not be set for workflow_dispatch"
              exit 1
            fi
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
      - name: Assert inputs are accepted (run shipped dist with an unsupported event, no API calls)
        run: |
          set +e
          OUT="$(env -i PATH="$PATH" HOME="$HOME" \
            GITHUB_EVENT_NAME=push \
            INPUT_TOKEN=dummy \
            INPUT_TIMEZONE=Asia/Tokyo \
            'INPUT_AFTER=17:30, 16:30 on Monday' \
            'INPUT_BEFORE=09:00, 08:00 on Monday' \
            'INPUT_PROHIBITED-DAYS-DATES=Sunday, Saturday, 2030-08-01, 2030-08-06/2030-08-10' \
            'INPUT_BASE-BRANCHES=/^.*$/' \
            node "$GITHUB_WORKSPACE/dist/index.js" 2>&1)"
          RC=$?
          set -e
          echo "rc: $RC"
          echo "$OUT"
          if [ "$RC" -ne 0 ]; then
            echo "FAIL: expected exit 0 with valid inputs"
            exit 1
          fi
          if ! echo "$OUT" | grep -q 'does not support the event "push"'; then
            echo "FAIL: expected unsupported event warning"
            exit 1
          fi
          echo "PASS"
