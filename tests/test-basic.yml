name: Test basic usage (non-PR event)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          timezone: UTC
          after: "00:00"
          before: "00:00"
        continue-on-error: true
      - name: Assert action ran (inputs accepted, not skipped or cancelled)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action makes real GitHub API calls; it may succeed or fail depending on
          # repo state (e.g. open PRs with old commits). We only verify it ran at all
          # (i.e. inputs were parsed without crashing) — not that it succeeded.
          if [ "$OUTCOME" = "skipped" ] || [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was skipped or cancelled unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME (success or failure both acceptable)"
