name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          after: "17:30, 16:30 on Monday"
          before: "09:00, 08:00 on Monday"
          timezone: Asia/Tokyo
          base-branches: "(default), /release\\/.*/"
          prohibited-days-dates: "Sunday, Saturday, 2030-08-01, 2030-08-06/2030-08-10"
      - name: Assert action ran (or failed gracefully on the sentinel repo)
        env:
          RESULT: ${{ steps.action.outputs.pr-blocked }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "pr-blocked: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            # pr-blocked is only set on pull_request events
            if [ -n "$RESULT" ]; then
              echo "FAIL: pr-blocked should not be set for workflow_dispatch"
              exit 1
            fi
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
