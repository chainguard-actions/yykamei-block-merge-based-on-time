name: Test basic usage - timezone only
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          timezone: UTC
      - name: Assert action ran (non-PR event skips or fails gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PR_BLOCKED: ${{ steps.action.outputs.pr-blocked }}
        run: |
          echo "outcome: $OUTCOME"
          echo "pr-blocked: $PR_BLOCKED"
          if [ "$OUTCOME" = "success" ]; then
            # Under workflow_dispatch, pr-blocked should not be set (only set on pull_request)
            echo "PASS: action succeeded (non-PR event, pr-blocked='$PR_BLOCKED')"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable or non-PR event handling)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
