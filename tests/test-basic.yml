name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Under workflow_dispatch the action lists all PRs of GITHUB_REPOSITORY,
      # which is a non-existent sentinel repo under the harness, so the API
      # call may 404. Assert on the outcome.
      - id: action
        uses: .
        continue-on-error: true
        with:
          timezone: UTC
      - name: Assert action ran (success, or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          BLOCKED: ${{ steps.action.outputs.pr-blocked }}
        run: |
          echo "outcome: $OUTCOME"
          echo "pr-blocked: '$BLOCKED'"
          if [ "$OUTCOME" = "success" ]; then
            if [ -n "$BLOCKED" ]; then
              echo "FAIL: pr-blocked should only be set on pull_request events"
              exit 1
            fi
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
      - name: Assert input parsing succeeds for an unsupported event (no API call)
        env:
          TOKEN: ${{ github.token }}
        run: |
          if ! command -v node >/dev/null 2>&1; then
            echo "node not available; skipping direct input validation"
            exit 0
          fi
          set +e
          OUT=$(env GITHUB_EVENT_NAME=push INPUT_TOKEN="$TOKEN" INPUT_TIMEZONE=UTC \
            INPUT_AFTER="00:00" INPUT_BEFORE="00:00" "INPUT_BASE-BRANCHES=/^.*$/" \
            node "$GITHUB_WORKSPACE/dist/index.js" 2>&1)
          RC=$?
          set -e
          echo "$OUT"
          echo "exit code: $RC"
          if [ "$RC" -ne 0 ]; then
            echo "FAIL: expected exit 0 with valid inputs"
            exit 1
          fi
          if ! echo "$OUT" | grep -q 'does not support the event'; then
            echo "FAIL: expected unsupported-event warning"
            exit 1
          fi
          echo "PASS"
