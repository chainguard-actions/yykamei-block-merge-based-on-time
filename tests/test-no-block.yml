name: Test - No Block (workflow_dispatch)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Use after=00:00 and before=00:00 which means no blocking window is configured.
      # The action should run successfully and set "success" status on any open PRs.
      # continue-on-error because the action may fail if open PRs have old commits.
      - id: action
        uses: .
        continue-on-error: true
        with:
          timezone: UTC
          after: "00:00"
          before: "00:00"
          commit-status-context: block-merge-based-on-time-test-no-block

      - name: Assert action ran (not skipped due to config error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should have run (success or failure due to old PR commits)
          # but not be skipped. Any outcome other than "skipped" means it ran.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with outcome: $OUTCOME"
