name: Test prohibited days configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Get current day of week
        id: day
        run: |
          DAY=$(date +%A)
          echo "day=$DAY" >> $GITHUB_OUTPUT
          echo "Current day: $DAY"

      - id: action
        uses: .
        with:
          timezone: UTC
          after: "00:00"
          before: "00:00"
          # Prohibit a day that is unlikely to be today (Saturday) to test parsing
          prohibited-days-dates: "Saturday"
          commit-status-context: block-merge-based-on-time-prohibited-test
          commit-status-description-with-success: "Test - The PR could be merged"
          commit-status-description-while-blocking: "Test - The PR cannot be merged"
        env:
          GITHUB_TOKEN: ${{ github.token }}
        continue-on-error: true

      - name: Assert action completed with prohibited-days config
        run: |
          echo "Action completed with prohibited-days-dates configuration"
          echo "pr-blocked output: '${{ steps.action.outputs.pr-blocked }}'"
          # Under workflow_dispatch, pr-blocked is not set (only on pull_request events)
          # Verify the action ran without crashing
          echo "PASS: action ran with prohibited-days-dates configuration"
