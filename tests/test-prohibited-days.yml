name: Test prohibited days configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          timezone: Europe/London
          after: "18:00"
          before: "08:00"
          prohibited-days-dates: "Saturday, Sunday"
          base-branches: "main, develop"
          commit-status-context: block-merge-based-on-time
      - name: Assert action ran with prohibited days config
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PR_BLOCKED: ${{ steps.action.outputs.pr-blocked }}
        run: |
          echo "outcome: $OUTCOME"
          echo "pr-blocked: $PR_BLOCKED"
          # Under workflow_dispatch (not pull_request), the action should either
          # succeed (no-op) or fail gracefully due to sentinel repo.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with prohibited days config"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected for sentinel repo or non-PR event)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
