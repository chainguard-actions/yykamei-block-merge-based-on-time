name: Test prohibited days and dates configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          timezone: Europe/London
          after: "18:00"
          before: "08:00"
          prohibited-days-dates: "Saturday, Sunday"
          no-block-label: "emergency-merge"
          base-branches: "/^.*$/"
      - name: Assert action ran with prohibited days config
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # On a non-PR event (workflow_dispatch), the action should either:
          # - succeed with no-op
          # - fail gracefully due to sentinel repo or non-PR event
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with prohibited days configuration"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected on sentinel repo or non-PR event)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
