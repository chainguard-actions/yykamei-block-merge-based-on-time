name: Test - Prohibited Days
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Block merges on all days of the week via prohibited-days-dates.
      # The action should complete (possibly with failure if open PRs have old commits).
      # continue-on-error because the action may fail if open PRs have old commits.
      - id: action
        uses: .
        continue-on-error: true
        with:
          timezone: UTC
          after: "00:00"
          before: "00:00"
          prohibited-days-dates: "Sunday, Monday, Tuesday, Wednesday, Thursday, Friday, Saturday"
          commit-status-context: block-merge-based-on-time-test-prohibited-days

      - name: Assert action ran (not skipped due to config error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with outcome: $OUTCOME"
