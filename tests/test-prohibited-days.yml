name: Test prohibited days configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          timezone: America/New_York
          after: "17:00"
          before: "09:00"
          prohibited-days-dates: "Saturday, Sunday"
      - name: Assert action ran with prohibited days config
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Under workflow_dispatch there is no PR context.
          # The action may succeed (no-op) or fail gracefully on sentinel repo.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action accepted prohibited-days-dates input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
