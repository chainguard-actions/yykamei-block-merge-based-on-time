name: Test prohibited days configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          timezone: Europe/London
          after: "00:00"
          before: "00:00"
          prohibited-days-dates: "Saturday, Sunday"
          no-block-label: "emergency-merge"
      - name: Assert action ran with prohibited days config
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PR_BLOCKED: ${{ steps.action.outputs.pr-blocked }}
        run: |
          echo "outcome: $OUTCOME"
          echo "pr-blocked: $PR_BLOCKED"
          # Under workflow_dispatch, there is no PR context.
          # The action may succeed (no-op) or fail gracefully (sentinel repo / no PR).
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with prohibited days config"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected — no PR context or sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
