name: Test timezone input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with America/New_York timezone
        id: action
        uses: .
        continue-on-error: true
        with:
          after: "17:30"
          before: "09:00"
          timezone: "America/New_York"

      - name: Assert action ran with timezone input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with America/New_York timezone"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo not resolvable or non-PR event)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
