name: Test timezone input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          after: "00:00"
          before: "00:00"
          timezone: "America/New_York"
          token: ${{ github.token }}
        continue-on-error: true
      - name: Assert action accepted timezone input
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action should accept the timezone input without crashing on it
          # In act environment without real PR context, it may fail on API calls
          # but should not fail due to invalid timezone
          if [ "${{ steps.action.outcome }}" = "failure" ]; then
            echo "INFO: Action failed (may be expected in act environment without real PR context)"
          else
            echo "PASS: Action completed with timezone America/New_York"
          fi
          echo "PASS: Test completed"
