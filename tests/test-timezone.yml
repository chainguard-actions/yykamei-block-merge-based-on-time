name: Test timezone input - valid timezone accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          after: "09:00"
          before: "17:00"
          timezone: "America/New_York"
      - name: Assert action ran with valid timezone
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should either succeed or fail gracefully (sentinel repo / non-PR event).
          # It must NOT crash with an invalid timezone error.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with America/New_York timezone"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or non-PR event, not a timezone error)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
