name: Test - Base Branches Filter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Set base-branches to a branch that won't match any open PRs.
      # Even with a blocking time window, no PRs should be blocked because
      # none of them target the specified base branch.
      # continue-on-error because the action may fail if open PRs have old commits.
      - id: action
        uses: .
        continue-on-error: true
        with:
          timezone: UTC
          after: "00:00"
          before: "23:59"
          base-branches: "nonexistent-branch-for-testing-only"
          commit-status-context: block-merge-based-on-time-test-base-branches

      - name: Assert action ran (not skipped due to config error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with outcome: $OUTCOME"
