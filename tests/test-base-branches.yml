name: Test base-branches filtering configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          timezone: UTC
          base-branches: "main, develop, /staging\\/.*/,  (default)"
          after: "18:00"
          before: "08:00"
      - name: Assert action ran with base-branches config
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PR_BLOCKED: ${{ steps.action.outputs.pr-blocked }}
        run: |
          echo "outcome: $OUTCOME"
          echo "pr-blocked: $PR_BLOCKED"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with base-branches config (non-PR event)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or non-PR event)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
