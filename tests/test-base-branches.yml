name: Test base-branches regex pattern configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          timezone: UTC
          after: "17:00"
          before: "09:00"
          base-branches: "/^main$/, /^release\\/.*$/, develop"

      - name: Assert action handled base-branches regex input gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Under workflow_dispatch there is no PR context, so the action may skip
          # PR-specific logic (success) or fail gracefully (failure).
          # Both are acceptable; an unexpected outcome is not.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with base-branches regex patterns"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no PR context under workflow_dispatch)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
