name: Test base-branches regex pattern
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          timezone: Asia/Tokyo
          after: "20:00"
          before: "10:00"
          base-branches: "/^(main|master|release\\/.*)$/, develop"
          prohibited-days-dates: "Saturday, Sunday"
          no-block-label: no-block
          commit-status-url: "https://example.com/policy"
      - name: Assert action ran with regex base-branches config
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PR_BLOCKED: ${{ steps.action.outputs.pr-blocked }}
        run: |
          echo "outcome: $OUTCOME"
          echo "pr-blocked: $PR_BLOCKED"
          # Under workflow_dispatch (not pull_request), the action should either
          # succeed (no-op) or fail gracefully due to sentinel repo.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with regex base-branches"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected for sentinel repo or non-PR event)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
