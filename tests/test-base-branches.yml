name: Test base-branches and no-block-label configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with specific base-branches and custom no-block-label
        id: action
        uses: .
        with:
          timezone: Asia/Tokyo
          after: "18:00"
          before: "09:00"
          base-branches: "main, develop, /staging\\/.*/"
          no-block-label: "emergency-merge"
          commit-status-context: custom-block-context
          commit-status-description-with-success: "Merge is allowed now"
          commit-status-description-while-blocking: "Merge is blocked outside business hours"
        continue-on-error: true
      - name: Assert action ran (success or expected API failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran to completion with valid inputs (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
