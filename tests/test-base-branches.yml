name: Test base-branches configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with specific base-branches (main and develop only)
        id: action
        uses: .
        with:
          after: "00:00"
          before: "00:00"
          timezone: "UTC"
          base-branches: "main, develop, /^release\\/.*/,"
          commit-status-context: "block-merge-test-base-branches"
        continue-on-error: true

      - name: Assert action ran (input validation passed)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME"
