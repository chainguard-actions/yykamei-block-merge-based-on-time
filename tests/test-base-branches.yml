name: Test base-branches and no-block-label inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with specific base-branches and custom no-block-label
        id: action
        uses: .
        with:
          timezone: America/New_York
          after: "17:00"
          before: "09:00"
          base-branches: "main, develop, /staging\\/.*/, (default)"
          no-block-label: "skip-block, emergency-merge"
          commit-status-context: block-merge-based-on-time-branches-test
        continue-on-error: true
      - name: Assert action ran with custom base-branches and no-block-label
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may fail if the repo has open PRs with old commits (GitHub API limitation).
          # We only fail the test if the action was cancelled (unexpected state).
          if [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was cancelled unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with custom base-branches and no-block-label (outcome=$OUTCOME)"
