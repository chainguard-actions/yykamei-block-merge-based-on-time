name: Test base branches configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          timezone: Asia/Tokyo
          after: "20:00"
          before: "09:00"
          base-branches: "main, develop, /^release\\/.*/,"
      - name: Assert action ran with base-branches config
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Under workflow_dispatch there is no PR context.
          # The action may succeed (no-op) or fail gracefully on sentinel repo.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action accepted base-branches configuration"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
