name: Test commit status customization options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with custom commit status options
        id: action
        uses: .
        with:
          timezone: Asia/Tokyo
          after: "00:00"
          before: "00:00"
          commit-status-context: block-merge-based-on-time-custom-test
          commit-status-description-with-success: "Merge is allowed now"
          commit-status-description-while-blocking: "Merging is not allowed at this time"
          commit-status-url: "https://example.com/merge-policy"
        continue-on-error: true
      - name: Assert action ran with custom commit status options
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may fail if the repo has open PRs with old commits (GitHub API limitation).
          # We only fail the test if the action was cancelled (unexpected state).
          if [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was cancelled unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with custom commit status options (outcome=$OUTCOME)"
