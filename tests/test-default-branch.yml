name: Test default branch base-branches value
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          timezone: UTC
          after: "17:30"
          before: "09:00"
          base-branches: "(default)"
          prohibited-days-dates: "Saturday, Sunday"
          commit-status-context: block-merge-based-on-time
          commit-status-description-with-success: "Merging is allowed now"
          commit-status-description-while-blocking: "Merging is blocked outside business hours"
          commit-status-url: "https://example.com/merge-policy"
      - name: Assert action ran with (default) base-branches
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PR_BLOCKED: ${{ steps.action.outputs.pr-blocked }}
        run: |
          echo "outcome: $OUTCOME"
          echo "pr-blocked: $PR_BLOCKED"
          # Under workflow_dispatch (not pull_request), the action should either
          # succeed (no-op) or fail gracefully due to sentinel repo.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with (default) base-branches"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected for sentinel repo or non-PR event)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
