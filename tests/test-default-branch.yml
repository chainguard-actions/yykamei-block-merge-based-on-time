name: Test default branch and day-of-week exception time
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          timezone: UTC
          after: "17:30, 16:30 on Monday"
          before: "09:00, 08:00 on Monday"
          base-branches: "(default)"
          prohibited-days-dates: "Sunday"
      - name: Assert action ran with default branch and day-of-week exception
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PR_BLOCKED: ${{ steps.action.outputs.pr-blocked }}
        run: |
          echo "outcome: $OUTCOME"
          echo "pr-blocked: $PR_BLOCKED"
          # Under workflow_dispatch, there is no PR context.
          # The action may succeed (no-op) or fail gracefully (sentinel repo / no PR).
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with default branch and day-of-week exception config"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected — no PR context or sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
