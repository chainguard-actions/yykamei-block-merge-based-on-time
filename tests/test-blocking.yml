name: Test - Blocking (workflow_dispatch)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Use after=00:00 and before=23:59 to block merges for the entire day.
      # The action itself should still complete (exit 0) even when blocking;
      # it sets "pending" commit status on open PRs but does not fail the workflow.
      # continue-on-error because the action may fail if open PRs have old commits.
      - id: action
        uses: .
        continue-on-error: true
        with:
          timezone: UTC
          after: "00:00"
          before: "23:59"
          commit-status-context: block-merge-based-on-time-test-blocking
          commit-status-description-while-blocking: "Merges are blocked for testing"

      - name: Assert action ran (not skipped due to config error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with outcome: $OUTCOME"
