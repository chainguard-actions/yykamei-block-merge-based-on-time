name: Test blocking - pr-blocked output is true
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          timezone: UTC
          after: "00:00"
          before: "23:59"
          token: ${{ github.token }}
        continue-on-error: true
      - name: Assert pr-blocked is true
        env:
          PR_BLOCKED: ${{ steps.action.outputs.pr-blocked }}
        run: |
          echo "pr-blocked: $PR_BLOCKED"
          if [ "$PR_BLOCKED" != "true" ]; then
            echo "FAIL: expected pr-blocked to be 'true', got '$PR_BLOCKED'"
            exit 1
          fi
          echo "PASS: pr-blocked is true as expected"
