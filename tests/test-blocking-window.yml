name: Test blocking window - merge blocked
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
      GITHUB_TOKEN: fake-token-for-testing
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          # Block from 00:00 to 23:59 covers the entire day - would always block
          after: "00:00"
          before: "23:59"
          timezone: "UTC"
          base-branches: "main"
          token: "fake-token-for-testing"
          commit-status-context: "block-merge-based-on-time"
          commit-status-description-with-success: "The PR could be merged"
          commit-status-description-while-blocking: "The PR can't be merged based on time"
        continue-on-error: true
      - name: Assert action step was attempted
        run: |
          echo "Action step outcome: ${{ steps.action.outcome }}"
          echo "pr-blocked: ${{ steps.action.outputs.pr-blocked }}"
          # The action sees a 'push' event (unsupported), logs a warning, and exits cleanly
          # It should succeed (not fail) for unsupported events
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action step was attempted with blocking window configuration"
