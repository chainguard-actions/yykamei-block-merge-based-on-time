name: Test block-all-day scenario (after=00:00, before=23:59)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          after: "00:00"
          before: "23:59"
          timezone: "UTC"
          token: ${{ github.token }}
        continue-on-error: true
      - name: Assert action ran
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome=${{ steps.action.outcome }})"
      - name: Assert pr-blocked output is true or action errored due to no PR context
        env:
          PR_BLOCKED: ${{ steps.action.outputs.pr-blocked }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "pr-blocked: $PR_BLOCKED"
          echo "outcome: $OUTCOME"
          # When after=00:00 and before=23:59, the entire day is blocked.
          # If the action succeeded (had PR context), pr-blocked should be true.
          # If it failed due to no real PR API context, that is acceptable in act.
          if [ "$OUTCOME" = "success" ] && [ "$PR_BLOCKED" != "true" ]; then
            echo "FAIL: expected pr-blocked=true when blocking all day, got '$PR_BLOCKED'"
            exit 1
          fi
          echo "PASS: pr-blocked=$PR_BLOCKED (outcome=$OUTCOME)"
