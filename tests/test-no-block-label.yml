name: Test - Custom No-Block Label
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Use a custom no-block-label. The action should accept this and run successfully.
      # Any open PRs with the label "skip-time-block" will not be blocked.
      # continue-on-error because the action may fail if open PRs have old commits.
      - id: action
        uses: .
        continue-on-error: true
        with:
          timezone: UTC
          after: "00:00"
          before: "23:59"
          no-block-label: "skip-time-block"
          commit-status-context: block-merge-based-on-time-test-no-block-label

      - name: Assert action ran (not skipped due to config error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with outcome: $OUTCOME"
