name: Test no-block label and commit status URL
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          timezone: Asia/Tokyo
          after: "18:00"
          before: "08:00"
          no-block-label: "skip-time-block"
          commit-status-context: "time-based-merge-block"
          commit-status-url: "https://example.com/merge-policy"
          base-branches: "/^(main|master|release\\/.*)$/"
      - name: Assert action ran with no-block label and URL config
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PR_BLOCKED: ${{ steps.action.outputs.pr-blocked }}
        run: |
          echo "outcome: $OUTCOME"
          echo "pr-blocked: $PR_BLOCKED"
          # Under workflow_dispatch, there is no PR context.
          # The action may succeed (no-op) or fail gracefully (sentinel repo / no PR).
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with no-block label and URL config"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected — no PR context or sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
