name: Test no-block-label input with timezone
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          timezone: Europe/London
          after: "00:00"
          before: "00:00"
          no-block-label: "skip-time-block"
          commit-status-context: block-merge-based-on-time
        env:
          GITHUB_TOKEN: ${{ github.token }}
        continue-on-error: true
      - name: Assert action step was executed with no-block-label and timezone inputs
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action requires GitHub API access which may not be available in act,
          # but the step should not be skipped - it should run and either succeed or fail
          # due to API limitations, not due to missing inputs.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action step was executed with timezone=Europe/London and no-block-label=skip-time-block (outcome: ${{ steps.action.outcome }})"
