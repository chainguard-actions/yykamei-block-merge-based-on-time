name: Test no-block label configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          after: "09:00"
          before: "17:00"
          timezone: "America/New_York"
          no-block-label: "skip-time-check"
          commit-status-context: "time-block-check"
          commit-status-description-with-success: "Merge is allowed"
          commit-status-description-while-blocking: "Merge is blocked by policy"
          token: ${{ github.token }}

      - name: Assert action ran (succeeded or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected on sentinel repo or non-PR event)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
