name: Test prohibited dates configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with prohibited date ranges
        id: action
        uses: .
        with:
          after: "00:00"
          before: "00:00"
          timezone: "UTC"
          # Prohibit a past date range (2020-01-01 to 2020-01-05) and a specific past date
          prohibited-days-dates: "2020-01-01/2020-01-05, 2020-12-25"
          commit-status-context: "block-merge-test-prohibited-dates"
        continue-on-error: true

      - name: Assert action ran (input validation passed)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME"
