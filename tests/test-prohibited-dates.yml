name: Test prohibited dates configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with specific prohibited dates
        id: action
        uses: .
        with:
          timezone: UTC
          prohibited-days-dates: "2024-01-01, 2024-12-25, 2024-08-01/2024-08-15"
          commit-status-context: block-merge-based-on-time
        continue-on-error: true
      - name: Assert action ran (success or expected API failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran to completion with valid inputs (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
