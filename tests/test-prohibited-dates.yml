name: Test prohibited dates with date ranges
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with prohibited date ranges
        id: action
        uses: .
        with:
          timezone: UTC
          prohibited-days-dates: "2099-01-01, 2099-08-01/2099-08-15, Saturday, Sunday"
          commit-status-context: block-merge-based-on-time-dates-test
        continue-on-error: true
      - name: Assert action ran with prohibited date ranges
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may fail if the repo has open PRs with old commits (GitHub API limitation).
          # We only fail the test if the action was cancelled (unexpected state).
          if [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was cancelled unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with prohibited date ranges (outcome=$OUTCOME)"
