name: Test custom commit status scenario
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY: "octocat/Hello-World"
      GITHUB_EVENT_NAME: workflow_dispatch
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          after: "00:00"
          before: "00:00"
          timezone: "America/New_York"
          commit-status-context: "my-custom-context"
          commit-status-description-with-success: "Merge is allowed!"
          commit-status-description-while-blocking: "Merge is blocked by policy!"
          commit-status-url: "https://example.com/policy"
          token: ${{ github.token }}
      - name: Assert action ran with custom status settings (API failure expected in act)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "step outcome: $OUTCOME"
          # The action will fail due to GitHub API unavailability in act,
          # but it should not fail due to input validation errors.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran as expected (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
