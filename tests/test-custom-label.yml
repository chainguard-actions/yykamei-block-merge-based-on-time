name: Test custom no-block label and commit status URL
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          after: "18:00"
          before: "08:00"
          timezone: "Asia/Tokyo"
          base-branches: "main, develop"
          no-block-label: "skip-time-block"
          commit-status-context: "custom-block-context"
          commit-status-description-with-success: "Merge is allowed now"
          commit-status-description-while-blocking: "Merge is blocked by policy"
          commit-status-url: "https://example.com/policy"
      - name: Assert action ran (API call fails gracefully on sentinel repo or succeeds)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with custom label and URL"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable or not a pull_request event)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
