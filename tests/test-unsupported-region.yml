name: Test unsupported holiday region
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          timezone: UTC
          prohibited-days-dates: "H:Nowhereland"
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for unsupported region"
            exit 1
          fi
          echo "PASS"
      - name: Assert error message
        run: |
          set +e
          OUT="$(env -i PATH="$PATH" HOME="$HOME" \
            GITHUB_EVENT_NAME=push \
            INPUT_TOKEN=dummy \
            INPUT_TIMEZONE=UTC \
            INPUT_AFTER=00:00 INPUT_BEFORE=00:00 \
            'INPUT_PROHIBITED-DAYS-DATES=H:Nowhereland' \
            node "$GITHUB_WORKSPACE/dist/index.js" 2>&1)"
          RC=$?
          set -e
          echo "rc: $RC"
          echo "$OUT"
          if [ "$RC" -eq 0 ]; then
            echo "FAIL: expected non-zero exit"
            exit 1
          fi
          if ! echo "$OUT" | grep -q 'Unsupported region is given: "Nowhereland"'; then
            echo "FAIL: expected unsupported region error"
            exit 1
          fi
          echo "PASS"
