name: Test custom labels and commit status configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          timezone: America/New_York
          after: "17:00"
          before: "09:00"
          no-block-label: "skip-time-block"
          commit-status-context: "custom-merge-gate"
          commit-status-description-with-success: "Merge is allowed now"
          commit-status-description-while-blocking: "Merge is blocked by policy"
          token: ${{ github.token }}
      - name: Assert action ran or failed gracefully with custom config
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PR_BLOCKED: ${{ steps.action.outputs.pr-blocked }}
        run: |
          echo "outcome: $OUTCOME"
          echo "pr-blocked: $PR_BLOCKED"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable or not a pull_request event)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
