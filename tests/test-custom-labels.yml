name: Test custom labels and commit status descriptions
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          timezone: America/New_York
          after: "18:00"
          before: "09:00"
          no-block-label: "emergency-merge"
          commit-status-context: "merge-policy"
          commit-status-description-with-success: "Merge is allowed at this time"
          commit-status-description-while-blocking: "Merge is blocked outside business hours"
          commit-status-url: "https://example.com/merge-policy"
          base-branches: "main, develop"
        continue-on-error: true
      - name: Assert action completed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may fail due to no real PR context under workflow_dispatch,
          # but it should not crash with an unhandled exception.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
