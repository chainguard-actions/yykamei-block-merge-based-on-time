name: Test custom label and status URL configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          timezone: Asia/Tokyo
          after: "18:00"
          before: "08:00"
          no-block-label: "skip-time-block"
          commit-status-context: "merge-policy"
          commit-status-description-with-success: "OK to merge"
          commit-status-description-while-blocking: "Blocked by merge policy"
          commit-status-url: "https://example.com/merge-policy"
          base-branches: "/^(main|release\\/.*)$/"
        continue-on-error: true
      - name: Assert action completed with custom label config
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Under workflow_dispatch there is no PR, so the action should either
          # succeed (skip) or fail gracefully. It must not crash the runner.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with outcome=$OUTCOME"
          else
            echo "FAIL: unexpected outcome=$OUTCOME"
            exit 1
          fi
