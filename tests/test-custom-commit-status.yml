name: Test custom commit status configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          timezone: Europe/London
          after: "18:00"
          before: "08:00"
          commit-status-context: "my-org/merge-policy"
          commit-status-description-with-success: "Merge is allowed"
          commit-status-description-while-blocking: "Merge is blocked by policy"
          commit-status-url: "https://example.com/merge-policy"
          no-block-label: "emergency-merge"
      - name: Assert action ran with custom commit status config
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Under workflow_dispatch there is no PR context.
          # The action may succeed (no-op) or fail gracefully on sentinel repo.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action accepted custom commit status configuration"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
