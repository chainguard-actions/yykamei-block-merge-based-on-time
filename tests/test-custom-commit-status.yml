name: Test custom commit-status inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          after: "00:00"
          before: "23:59"
          timezone: "America/New_York"
          no-block-label: "skip-time-block"
          commit-status-context: "my-org/block-merge"
          commit-status-description-with-success: "Merge is allowed"
          commit-status-description-while-blocking: "Merge is blocked by policy"
          commit-status-url: "https://example.com/policy"
          token: ${{ github.token }}

      - name: Assert action ran with custom commit-status config (or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with custom commit-status inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected on sentinel repo — API call to set commit status cannot succeed)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
