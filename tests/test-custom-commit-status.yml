name: Test custom commit status inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          timezone: America/New_York
          after: "00:00"
          before: "00:00"
          commit-status-context: my-custom-context
          commit-status-description-with-success: "Merge is allowed"
          commit-status-description-while-blocking: "Merge is blocked by policy"
          commit-status-url: "https://example.com/policy"
        continue-on-error: true
      - name: Assert action ran (not cancelled or skipped)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action makes real GitHub API calls and may fail if there are open PRs
          # with old commits. We accept both success and failure, just not skipped/cancelled.
          if [ "$OUTCOME" = "cancelled" ] || [ -z "$OUTCOME" ]; then
            echo "FAIL: action was cancelled or did not run"
            exit 1
          fi
          echo "PASS: action ran with outcome '$OUTCOME' (success or failure both acceptable)"
