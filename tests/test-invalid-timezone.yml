name: Test invalid timezone
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          timezone: Not/A_Real_Zone
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for an invalid timezone"
            exit 1
          fi
          echo "PASS"
      - name: Assert the failure is due to the timezone (no API call)
        env:
          TOKEN: ${{ github.token }}
        run: |
          if ! command -v node >/dev/null 2>&1; then
            echo "node not available; skipping direct input validation"
            exit 0
          fi
          set +e
          OUT=$(env GITHUB_EVENT_NAME=push INPUT_TOKEN="$TOKEN" INPUT_TIMEZONE="Not/A_Real_Zone" \
            INPUT_AFTER="00:00" INPUT_BEFORE="00:00" \
            node "$GITHUB_WORKSPACE/dist/index.js" 2>&1)
          RC=$?
          set -e
          echo "$OUT"
          echo "exit code: $RC"
          if [ "$RC" -eq 0 ]; then
            echo "FAIL: expected non-zero exit for invalid timezone"
            exit 1
          fi
          if ! echo "$OUT" | grep -qi 'zone'; then
            echo "FAIL: expected an error mentioning the zone"
            exit 1
          fi
          echo "PASS"
