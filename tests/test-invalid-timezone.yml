name: Test - Invalid Timezone Error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # An invalid timezone should cause the action to fail immediately
      # before making any API calls (timezone validation happens in Inputs constructor).
      - id: action
        uses: .
        continue-on-error: true
        with:
          timezone: "Invalid/Timezone/That/Does/Not/Exist"
          after: "09:00"
          before: "17:00"

      - name: Assert action failed due to invalid timezone
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid timezone, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid timezone"
