name: Test invalid timezone error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid timezone (should fail)
        id: action
        uses: .
        with:
          after: "00:00"
          before: "00:00"
          timezone: "Not/A/Valid/Timezone"
          commit-status-context: "block-merge-test-invalid-tz"
        continue-on-error: true

      - name: Assert action failed due to invalid timezone
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid timezone, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid timezone"
