name: Test always-open time window (no blocking)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          after: "00:00"
          before: "00:00"
          timezone: "America/New_York"
          base-branches: "main"
          commit-status-context: "block-merge-based-on-time"
          commit-status-description-with-success: "The PR could be merged"
          commit-status-description-while-blocking: "The PR can't be merged based on time"
      - name: Assert action ran (API call fails gracefully on sentinel repo or succeeds)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (no blocking configured)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable or not a pull_request event)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
