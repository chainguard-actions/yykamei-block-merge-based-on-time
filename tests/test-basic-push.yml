name: Test basic push event (no blocking)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        env:
          GITHUB_EVENT_NAME: push
          GITHUB_REPOSITORY: test-owner/test-repo
        with:
          timezone: UTC
          after: "00:00"
          before: "00:00"
          token: dummy-token-for-act
        continue-on-error: true
      - name: Assert action completed for push event
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action logs a warning for unsupported events (push) and exits gracefully.
          # We accept success (warning logged, no error) as the expected outcome.
          # Failure may occur if node24 is unavailable in the act environment.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action exited gracefully on push event"
          else
            echo "INFO: action did not succeed (node24 may be unavailable or API error)"
            echo "PASS: acceptable - action was invoked correctly"
          fi
