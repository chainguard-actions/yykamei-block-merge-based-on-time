name: Test invalid custom holidays file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          timezone: UTC
          prohibited-days-dates: "H:MyCompany"
          custom-holidays-path: ${{ github.workspace }}/tests/fixtures/invalid-holidays.json
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid custom holidays file"
            exit 1
          fi
          echo "PASS"
      - name: Assert error messages (bad format and missing file)
        run: |
          run_dist() {
            env -i PATH="$PATH" HOME="$HOME" \
              GITHUB_EVENT_NAME=push \
              INPUT_TOKEN=dummy \
              INPUT_TIMEZONE=UTC \
              INPUT_AFTER=00:00 INPUT_BEFORE=00:00 \
              'INPUT_PROHIBITED-DAYS-DATES=H:MyCompany' \
              "INPUT_CUSTOM-HOLIDAYS-PATH=$1" \
              node "$GITHUB_WORKSPACE/dist/index.js" 2>&1
          }
          set +e
          OUT="$(run_dist "$GITHUB_WORKSPACE/tests/fixtures/invalid-holidays.json")"
          RC=$?
          set -e
          echo "rc: $RC"; echo "$OUT"
          if [ "$RC" -eq 0 ] || ! echo "$OUT" | grep -q 'Expected JSON format'; then
            echo "FAIL: expected JSON format error"
            exit 1
          fi
          set +e
          OUT="$(run_dist "$GITHUB_WORKSPACE/tests/fixtures/does-not-exist.json")"
          RC=$?
          set -e
          echo "rc: $RC"; echo "$OUT"
          if [ "$RC" -eq 0 ] || ! echo "$OUT" | grep -q 'Custom holidays file does not exist'; then
            echo "FAIL: expected missing file error"
            exit 1
          fi
          echo "PASS"
