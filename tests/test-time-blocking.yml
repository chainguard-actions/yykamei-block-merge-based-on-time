name: Test time-based blocking configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with time-based blocking (after 09:00, before 17:00)
        id: action
        uses: .
        with:
          timezone: America/New_York
          after: "09:00"
          before: "17:00"
          commit-status-context: block-merge-based-on-time
          commit-status-description-with-success: Merging is allowed
          commit-status-description-while-blocking: Merging is blocked during business hours
        continue-on-error: true
      - name: Assert action ran (success or expected API failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran to completion with valid inputs (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
