name: Test invalid after format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          timezone: UTC
          after: "17:30 on Funday"
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for an invalid 'after' value"
            exit 1
          fi
          echo "PASS"
      - name: Assert the failure is due to the after format (no API call)
        env:
          TOKEN: ${{ github.token }}
        run: |
          if ! command -v node >/dev/null 2>&1; then
            echo "node not available; skipping direct input validation"
            exit 0
          fi
          set +e
          OUT=$(env GITHUB_EVENT_NAME=push INPUT_TOKEN="$TOKEN" INPUT_TIMEZONE=UTC \
            INPUT_AFTER="17:30 on Funday" INPUT_BEFORE="00:00" \
            node "$GITHUB_WORKSPACE/dist/index.js" 2>&1)
          RC=$?
          set -e
          echo "$OUT"
          echo "exit code: $RC"
          if [ "$RC" -eq 0 ]; then
            echo "FAIL: expected non-zero exit"
            exit 1
          fi
          if ! echo "$OUT" | grep -q 'Invalid "after" was given'; then
            echo "FAIL: expected 'Invalid \"after\" was given' error"
            exit 1
          fi
          echo "PASS"
