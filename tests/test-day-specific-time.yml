name: Test day-specific time overrides
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
      pull-requests: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with day-specific time overrides
        id: action
        uses: .
        continue-on-error: true
        with:
          timezone: UTC
          after: "09:00, 08:00 on Monday"
          before: "05:00, 04:00 on Monday"
          commit-status-context: block-merge-based-on-time-test-day-specific
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "step outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME)"
