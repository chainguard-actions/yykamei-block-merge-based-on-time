name: Test no-blocking time window
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          after: "00:00"
          before: "00:00"
          timezone: "UTC"
          token: ${{ github.token }}

      - name: Assert action ran (not blocked or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PR_BLOCKED: ${{ steps.action.outputs.pr-blocked }}
        run: |
          echo "outcome: $OUTCOME"
          echo "pr-blocked: $PR_BLOCKED"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (no blocking window configured)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected on sentinel repo — API call to set commit status cannot succeed)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
