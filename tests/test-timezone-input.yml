name: Test timezone input is accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          timezone: America/New_York
          after: "00:00"
          before: "00:00"
          base-branches: "main"
          commit-status-context: block-merge-based-on-time
          commit-status-description-with-success: The PR could be merged
        env:
          GITHUB_TOKEN: ${{ github.token }}
        continue-on-error: true
      - name: Assert action step was executed with timezone input
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action requires GitHub API access which may not be available in act,
          # but the step should not be skipped - it should run and either succeed or fail
          # due to API limitations, not due to missing timezone input.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action step was executed with timezone=America/New_York (outcome: ${{ steps.action.outcome }})"
