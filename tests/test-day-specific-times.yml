name: Test day-specific time exceptions
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with day-specific time exceptions
        id: action
        uses: .
        with:
          timezone: Europe/Paris
          after: "17:30, 16:30 on Monday, 16:00 on Friday"
          before: "09:00, 08:00 on Monday"
          prohibited-days-dates: "Saturday, Sunday"
          commit-status-context: block-merge-based-on-time
        continue-on-error: true
      - name: Assert action ran (success or expected API failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran to completion with valid inputs (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
