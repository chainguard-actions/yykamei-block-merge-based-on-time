name: Test invalid after format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          timezone: UTC
          after: "17:30 on Funday"
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid after"
            exit 1
          fi
          echo "PASS"
      - name: Assert error message
        run: |
          set +e
          OUT="$(env -i PATH="$PATH" HOME="$HOME" \
            GITHUB_EVENT_NAME=push \
            INPUT_TOKEN=dummy \
            INPUT_TIMEZONE=UTC \
            'INPUT_AFTER=17:30 on Funday' INPUT_BEFORE=00:00 \
            node "$GITHUB_WORKSPACE/dist/index.js" 2>&1)"
          RC=$?
          set -e
          echo "rc: $RC"
          echo "$OUT"
          if [ "$RC" -eq 0 ]; then
            echo "FAIL: expected non-zero exit"
            exit 1
          fi
          if ! echo "$OUT" | grep -q 'Invalid "after" was given'; then
            echo "FAIL: expected 'Invalid \"after\" was given' error"
            exit 1
          fi
          echo "PASS"
