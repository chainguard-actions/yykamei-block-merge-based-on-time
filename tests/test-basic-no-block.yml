name: Test basic usage - no time blocking
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with no time blocking (after == before == 00:00)
        id: action
        uses: .
        with:
          # after == before means no time-based blocking
          after: "00:00"
          before: "00:00"
          timezone: "UTC"
          commit-status-context: "block-merge-test-basic"
          commit-status-description-with-success: "Merge is allowed"
          commit-status-description-while-blocking: "Merge is blocked"
        continue-on-error: true

      - name: Assert action ran (input validation passed)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may fail due to GitHub API issues (e.g. old PR commits),
          # but it should NOT fail due to input validation errors.
          # A 'skipped' outcome would indicate a structural problem.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME (success or API-related failure both acceptable)"
