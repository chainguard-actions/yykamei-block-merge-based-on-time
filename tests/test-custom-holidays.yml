name: Test custom holidays and day exceptions
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          timezone: Asia/Tokyo
          after: "17:30, 16:30 on Friday"
          before: "09:00, 08:00 on Monday"
          base-branches: "(default), /^release\\/.*/"
          prohibited-days-dates: "Sunday, Saturday, 2021-08-06/2021-08-10, H:MyCompany, BH:MyCompany"
          custom-holidays-path: tests/fixtures/custom-holidays-single.json
          no-block-label: "no-block, hotfix"
      - name: Assert action ran (success, or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
      - name: Assert these inputs parse successfully (no API call)
        env:
          TOKEN: ${{ github.token }}
        run: |
          if ! command -v node >/dev/null 2>&1; then
            echo "node not available; skipping direct input validation"
            exit 0
          fi
          set +e
          OUT=$(env GITHUB_EVENT_NAME=push INPUT_TOKEN="$TOKEN" INPUT_TIMEZONE=Asia/Tokyo \
            INPUT_AFTER="17:30, 16:30 on Friday" INPUT_BEFORE="09:00, 08:00 on Monday" \
            "INPUT_BASE-BRANCHES=(default), /^release\/.*/" \
            "INPUT_NO-BLOCK-LABEL=no-block, hotfix" \
            "INPUT_PROHIBITED-DAYS-DATES=Sunday, Saturday, 2021-08-06/2021-08-10, H:MyCompany, BH:MyCompany" \
            "INPUT_CUSTOM-HOLIDAYS-PATH=$GITHUB_WORKSPACE/tests/fixtures/custom-holidays-single.json" \
            node "$GITHUB_WORKSPACE/dist/index.js" 2>&1)
          RC=$?
          set -e
          echo "$OUT"
          echo "exit code: $RC"
          if [ "$RC" -ne 0 ]; then
            echo "FAIL: expected exit 0 with valid custom holidays"
            exit 1
          fi
          if ! echo "$OUT" | grep -q 'does not support the event "push"'; then
            echo "FAIL: expected unsupported-event warning after successful input parsing"
            exit 1
          fi
          echo "PASS"
