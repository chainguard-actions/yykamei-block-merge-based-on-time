name: Test custom holidays path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create custom holidays JSON file
        run: |
          mkdir -p /tmp/test-holidays
          cat > /tmp/test-holidays/holidays.json << 'EOF'
          {"TestRegion": [{"date": "2099-01-01"}, {"date": "2099-12-25"}]}
          EOF
          echo "Created custom holidays file"
      - name: Run action with custom holidays path
        id: action
        uses: .
        with:
          timezone: UTC
          prohibited-days-dates: "H:TestRegion"
          custom-holidays-path: /tmp/test-holidays/holidays.json
        continue-on-error: true
      - name: Assert action ran with custom holidays
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may fail if the repo has open PRs with old commits (GitHub API limitation).
          # We only fail the test if the action was cancelled (unexpected state).
          if [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was cancelled unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with custom holidays (outcome=$OUTCOME)"
