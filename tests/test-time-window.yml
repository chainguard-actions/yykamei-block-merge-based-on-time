name: Test time window blocking
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          # Block from 17:30 to 09:00 next day (outside business hours)
          after: "17:30"
          before: "09:00"
          timezone: "America/New_York"
          base-branches: "main"
          commit-status-context: "merge-policy"
          commit-status-description-with-success: "Merging is allowed"
          commit-status-description-while-blocking: "Merging is not allowed outside business hours"
        continue-on-error: true

      - name: Assert action ran
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "" ]; then
            echo "FAIL: action did not run at all"
            exit 1
          fi
          echo "PASS: action ran with outcome ${{ steps.action.outcome }}"
