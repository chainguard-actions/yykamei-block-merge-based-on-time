name: Test missing custom holidays file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          timezone: UTC
          prohibited-days-dates: "H:MyCompany"
          custom-holidays-path: tests/fixtures/does-not-exist.json
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for a missing custom holidays file"
            exit 1
          fi
          echo "PASS"
      - name: Assert the failure is due to the missing file (no API call)
        env:
          TOKEN: ${{ github.token }}
        run: |
          if ! command -v node >/dev/null 2>&1; then
            echo "node not available; skipping direct input validation"
            exit 0
          fi
          set +e
          OUT=$(env GITHUB_EVENT_NAME=push INPUT_TOKEN="$TOKEN" INPUT_TIMEZONE=UTC \
            INPUT_AFTER="00:00" INPUT_BEFORE="00:00" \
            "INPUT_PROHIBITED-DAYS-DATES=H:MyCompany" \
            "INPUT_CUSTOM-HOLIDAYS-PATH=$GITHUB_WORKSPACE/tests/fixtures/does-not-exist.json" \
            node "$GITHUB_WORKSPACE/dist/index.js" 2>&1)
          RC=$?
          set -e
          echo "$OUT"
          echo "exit code: $RC"
          if [ "$RC" -eq 0 ]; then
            echo "FAIL: expected non-zero exit"
            exit 1
          fi
          if ! echo "$OUT" | grep -q 'Custom holidays file does not exist'; then
            echo "FAIL: expected missing-file error"
            exit 1
          fi
          echo "PASS"
