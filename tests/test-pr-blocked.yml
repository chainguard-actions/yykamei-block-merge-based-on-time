name: Test pull_request event - blocked scenario
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        env:
          GITHUB_EVENT_NAME: pull_request
          GITHUB_REF: refs/pull/1/merge
          GITHUB_HEAD_REF: feature-branch
          GITHUB_BASE_REF: main
          GITHUB_REPOSITORY: test-owner/test-repo
        with:
          timezone: UTC
          after: "00:00"
          before: "23:59"
          base-branches: main
          token: dummy-token-for-act
        continue-on-error: true
      - name: Assert action ran for pull_request event
        env:
          PR_BLOCKED: ${{ steps.action.outputs.pr-blocked }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "pr-blocked: $PR_BLOCKED"
          # The action attempts GitHub API calls for pull_request events.
          # In act with a dummy token, these calls will fail.
          # We accept either outcome as valid for this test environment.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with pr-blocked=$PR_BLOCKED"
          else
            echo "INFO: action failed (GitHub API unavailable with dummy token in act)"
            echo "PASS: acceptable in act environment"
          fi
